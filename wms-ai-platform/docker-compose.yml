    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8106/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # 19. 无人机盘点模块
  module-drone:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8107:8107"
    environment:
      - ENV=development
      - REDIS_HOST=redis
      - MYSQL_HOST=mysql
      - MINIO_ENDPOINT=minio:9000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MODEL_SERVICE_URL=http://model-service:8001
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      model-service:
        condition: service_healthy
    command: ["python", "-m", "uvicorn", "modules.drone.main:app", "--host", "0.0.0.0", "--port", "8107"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8107/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # 20. 视频分析模块
  module-video:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8108:8108"
    environment:
      - ENV=development
      - REDIS_HOST=redis
      - CLICKHOUSE_HOST=clickhouse
      - MINIO_ENDPOINT=minio:9000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MODEL_SERVICE_URL=http://model-service:8001
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      model-service:
        condition: service_healthy
    command: ["python", "-m", "uvicorn", "modules.video.main:app", "--host", "0.0.0.0", "--port", "8108"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8108/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  clickhouse_data:
  etcd_data:
  milvus_data:
  minio_data:
  prometheus_data:
