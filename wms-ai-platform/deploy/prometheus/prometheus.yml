# WMS AI Platform - Prometheus 监控配置
# PRD V2.0：采集 12 个 FastAPI 服务的 /metrics 端点

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: wms-ai-platform

# 告警规则文件（可选）
# rule_files:
#   - /etc/prometheus/rules/*.yml

# AlertManager 配置（B5-T4 AIOps Webhook）
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            # - alertmanager:9093

scrape_configs:
  # ===== 中间件自监控 =====
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ===== AI 平台核心服务 =====
  - job_name: 'gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:8000']
        labels:
          service: gateway

  - job_name: 'model-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['model-service:8001']
        labels:
          service: model-service

  - job_name: 'data-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['data-service:8002']
        labels:
          service: data-service

  - job_name: 'scheduler'
    metrics_path: /metrics
    static_configs:
      - targets: ['scheduler:8003']
        labels:
          service: scheduler

  # ===== 8 大业务模块 =====
  - job_name: 'module-ocr'
    metrics_path: /metrics
    static_configs:
      - targets: ['module-ocr:8101']
        labels:
          service: ocr

  - job_name: 'module-forecast'
    metrics_path: /metrics
    static_configs:
      - targets: ['module-forecast:8102']
        labels:
          service: forecast

  - job_name: 'module-report'
    metrics_path: /metrics
    static_configs:
      - targets: ['module-report:8103']
        labels:
          service: report

  - job_name: 'module-rag'
    metrics_path: /metrics
    static_configs:
      - targets: ['module-rag:8104']
        labels:
          service: rag

  - job_name: 'module-aiops'
    metrics_path: /metrics
    static_configs:
      - targets: ['module-aiops:8105']
        labels:
          service: aiops

  - job_name: 'module-voice'
    metrics_path: /metrics
    static_configs:
      - targets: ['module-voice:8106']
        labels:
          service: voice

  - job_name: 'module-drone'
    metrics_path: /metrics
    static_configs:
      - targets: ['module-drone:8107']
        labels:
          service: drone

  - job_name: 'module-video'
    metrics_path: /metrics
    static_configs:
      - targets: ['module-video:8108']
        labels:
          service: video
