# WMS AI Platform - K3s 部署清单
# 包含：Namespace / ConfigMap / 所有服务Deployment+Service / Ingress

---
# ========== Namespace ==========
apiVersion: v1
kind: Namespace
metadata:
  name: wms-ai
  labels:
    app: wms-ai-platform

---
# ========== ConfigMap（环境变量） ==========
apiVersion: v1
kind: ConfigMap
metadata:
  name: wms-ai-config
  namespace: wms-ai
data:
  ENV: "production"
  LOG_LEVEL: "INFO"
  REDIS_HOST: "redis.wms-ai.svc.cluster.local"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.wms-ai.svc.cluster.local:9092"
  CLICKHOUSE_HOST: "clickhouse.wms-ai.svc.cluster.local"
  CLICKHOUSE_DATABASE: "wms_ai"
  MINIO_ENDPOINT: "minio.wms-ai.svc.cluster.local:9000"
  MINIO_BUCKET: "wms-ai"
  MILVUS_HOST: "milvus.wms-ai.svc.cluster.local"
  MODEL_SERVICE_URL: "http://model-service.wms-ai.svc.cluster.local:8001"
  LLM_MODEL: "deepseek-v4-pro"
  FORECAST_MODEL: "prophet"

---
# ========== Secret（敏感配置） ==========
apiVersion: v1
kind: Secret
metadata:
  name: wms-ai-secret
  namespace: wms-ai
type: Opaque
stringData:
  # @deprecated PRD V2.0 改用 MySQL，保留兼容（Oracle 仅用于只读查询 WMS 历史数据）
  ORACLE_USER: "wms_user"
  ORACLE_PASSWORD: "change_me_in_production"
  ORACLE_DSN: "oracle.db.svc.cluster.local:1521/ORCLPDB1"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "change_me_in_production"
  JWT_SECRET: "change-me-to-a-random-secret-key"
  LLM_API_KEY: "sk-xxx"

---
# ========== 通用模板：Python FastAPI服务 ==========
# 以下每个服务使用相同的部署模板，通过args区分启动命令

---
# API网关
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: wms-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: wms-ai-platform:latest
          command: ["python", "-m", "uvicorn", "gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: wms-ai-config
            - secretRef:
                name: wms-ai-secret
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: wms-ai
spec:
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP

---
# 统一模型服务（纯 API 调用，无 GPU）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-service
  namespace: wms-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-service
  template:
    metadata:
      labels:
        app: model-service
    spec:
      containers:
        - name: model-service
          image: wms-ai-platform:latest
          command: ["python", "-m", "uvicorn", "model_service.main:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: wms-ai-config
            - secretRef:
                name: wms-ai-secret
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: model-service
  namespace: wms-ai
spec:
  selector:
    app: model-service
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP

