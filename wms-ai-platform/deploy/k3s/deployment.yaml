---
# ========== Ingress（统一入口） ==========
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wms-ai-ingress
  namespace: wms-ai
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: ai.wms.local
      http:
        paths:
          - path: /api/ocr
            pathType: Prefix
            backend:
              service:
                name: module-ocr
                port:
                  number: 8101
          - path: /api/forecast
            pathType: Prefix
            backend:
              service:
                name: module-forecast
                port:
                  number: 8102
          - path: /api/report
            pathType: Prefix
            backend:
              service:
                name: module-report
                port:
                  number: 8103
          - path: /api/rag
            pathType: Prefix
            backend:
              service:
                name: module-rag
                port:
                  number: 8104
          - path: /api/aiops
            pathType: Prefix
            backend:
              service:
                name: module-aiops
                port:
                  number: 8105
          - path: /api/voice
            pathType: Prefix
            backend:
              service:
                name: module-voice
                port:
                  number: 8106
          - path: /api/drone
            pathType: Prefix
            backend:
              service:
                name: module-drone
                port:
                  number: 8107
          - path: /api/video
            pathType: Prefix
            backend:
              service:
                name: module-video
                port:
                  number: 8108

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forecast-models-pvc
  namespace: wms-ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# ========== HPA（自动扩缩容） ==========
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: wms-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ocr-hpa
  namespace: wms-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: module-ocr
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
