# ============================================================
# X WMS 平台 - 共享配置 (wms-common.yaml)
# 所有服务共享的公共配置：数据库/Redis/Kafka/日志/MyBatis
# Nacos DataId: wms-common.yaml, Group: WMS_GROUP
# ============================================================

spring:
  # 虚拟线程（Java 25+）
  threads:
    virtual:
      enabled: true

  # 数据源（Oracle 23ai）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@${DB_HOST:localhost}:${DB_PORT:1521}:${DB_SID:XEPDB1}
    username: ${DB_USERNAME:wms}
    password: ${DB_PASSWORD:wms123}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # Redis 8.0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # Kafka 4.0 KRaft
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 10
      properties:
        enable.idempotence: true
        # TraceId生产者拦截器
        interceptor.classes: com.xwms.common.trace.interceptor.KafkaTraceProducerInterceptor
    consumer:
      group-id: wms-default-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # TraceId消费者拦截器
        interceptor.classes: com.xwms.common.trace.interceptor.KafkaTraceConsumerInterceptor
    listener:
      ack-mode: manual_immediate
      concurrency: 3

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

# 日志
logging:
  level:
    com.xwms: info
    com.xwms.core.mapper: debug
    org.springframework.kafka: warn
    com.alibaba.nacos: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
