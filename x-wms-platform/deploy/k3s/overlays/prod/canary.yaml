apiVersion: apps/v1
kind: Deployment
metadata:
  name: wms-core-canary
  labels:
    app: wms-core
    tier: canary
spec:
  replicas: 0
  selector:
    matchLabels:
      app: wms-core
      tier: canary
  template:
    metadata:
      labels:
        app: wms-core
        tier: canary
    spec:
      containers:
        - name: wms-core
          image: wms-core:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: wms-env
            - secretRef:
                name: wms-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: wms-core-canary
spec:
  selector:
    app: wms-core
    tier: canary
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
