apiVersion: apps/v1
kind: Deployment
metadata:
  name: wms-analytics
  labels:
    app: wms-analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wms-analytics
  template:
    metadata:
      labels:
        app: wms-analytics
    spec:
      containers:
        - name: wms-analytics
          image: wms-analytics:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: wms-env
            - secretRef:
                name: wms-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: wms-analytics
spec:
  selector:
    app: wms-analytics
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP
