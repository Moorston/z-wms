[package]
name = "xwms-pack-station"
version = "1.0.0"
description = "X WMS 打包台客户端"
authors = ["X WMS Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-serial = "5" # 串口通信（电子秤）
escpos = "0.3" # ESC/POS热敏打印

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
