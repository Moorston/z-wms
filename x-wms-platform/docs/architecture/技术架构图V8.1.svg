  <!-- 关键决策标注 -->
  <rect x="20" y="630" width="640" height="100" class="layer-box" stroke="#22c55e"/>
  <text x="30" y="648" class="layer-label" fill="#16a34a">关键架构决策（经 9 家主流厂商验证 · 综合评分 9.2/10）</text>
  <text x="40" y="668" class="node-sub" text-anchor="start">① 库存扣减：Oracle 原子 SQL + 乐观锁，强一致，实际并发 &lt;100 QPS 完全够用</text>
  <text x="40" y="684" class="node-sub" text-anchor="start">② 4 微服务：core/base/analytics/integration，DDD 限界上下文，不过度拆分</text>
  <text x="40" y="700" class="node-sub" text-anchor="start">③ 不分库分表：分区表+归档+OLAP 分离，WMS 数据量可控，复杂度低</text>
  <text x="40" y="716" class="node-sub" text-anchor="start">④ 消息队列：Kafka 4.0 KRaft(核心事件流) + Redis Stream/PubSub(轻量任务)，各取所长</text>

  <!-- 成本与指标 -->
  <rect x="20" y="746" width="310" height="80" class="layer-box" stroke="#3b82f6"/>
  <text x="30" y="764" class="layer-label" fill="#2563eb">成本指标</text>
  <text x="40" y="784" class="node-sub" text-anchor="start">硬件成本：约 ¥15 万/年（云）/ ¥8 万/年（自建）</text>
  <text x="40" y="800" class="node-sub" text-anchor="start">团队规模：3-5 人后端 + 1 前端 + 1 运维</text>
  <text x="40" y="816" class="node-sub" text-anchor="start">License：全开源零成本（Oracle 用户已有）</text>

  <rect x="350" y="746" width="310" height="80" class="layer-box" stroke="#f59e0b"/>
  <text x="360" y="764" class="layer-label" fill="#d97706">性能与高可用</text>
  <text x="370" y="784" class="node-sub" text-anchor="start">高并发：上游 2000 QPS / 作业 100 并发</text>
  <text x="370" y="800" class="node-sub" text-anchor="start">高可用：核心 SLA 99.9%，RTO &lt;30s，RPO=0</text>
  <text x="370" y="816" class="node-sub" text-anchor="start">库存扣减：&lt;50ms，Oracle 单行 500-2000 QPS</text>

