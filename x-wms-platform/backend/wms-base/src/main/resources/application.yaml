server:
  port: 8082
  servlet:
    context-path: /api
spring:
  application:
    name: wms-base
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: wms
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: wms
        file-extension: yaml
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: ${SENTINEL_PORT:8719}
      eager: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:wms_base}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:root}
    druid:
      initial-size: 3
      max-active: 30
      min-idle: 3
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 1
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
spring.threads.virtual.enabled: true

# PowerJob 分布式任务调度 Worker
powerjob:
  worker:
    enabled: true
    app-name: wms-base
    server-address: ${POWERJOB_SERVER:127.0.0.1:7700}
    protocol: AKKA
    port: 27778
    result-store-max-length: 4096
    max-result-length: 4096

# SpringDoc 全局设置
setting:
  language: zh_cn
  enable-version: true
  enable-search: true
  home-custom-message: "X WMS 基础数据服务接口文档"

# SpringDoc OpenAPI配置
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: "数据字典"
      paths-to-match: /dict/**
      packages-to-scan: com.xwms.base.dict
    - group: "库位管理"
      paths-to-match: /location/**, /warehouse/**, /area/**
      packages-to-scan: com.xwms.base.location
    - group: "基础档案"
      paths-to-match: /product/**, /owner/**, /customer/**
      packages-to-scan: com.xwms.base.master
    - group: "规则引擎"
      paths-to-match: /rule/**
      packages-to-scan: com.xwms.base.rule
    - group: "系统管理"
      paths-to-match: /system/**, /user/**, /role/**
      packages-to-scan: com.xwms.base.system
    - group: "全部接口"
      paths-to-match: /**
      packages-to-scan: com.xwms.base

# 敏感信息加密配置
wms:
  crypto:
    enabled: true
    # 32字节密钥（256位），生产环境通过环境变量 WMS_CRYPTO_SECRET_KEY 覆盖
    secret-key: x-wms-platform-aes-256-key-2026!!
