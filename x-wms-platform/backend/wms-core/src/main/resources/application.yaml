server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: wms-core
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: wms
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: wms
        file-extension: yaml
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: ${SENTINEL_PORT:8719}
      eager: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:wms_core}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:root}
    druid:
      initial-size: 5
      max-active: 50
      min-idle: 5
      max-wait: 60000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:}
      database: 0
  kafka:
    bootstrap-servers: ${KAFKA_ADDR:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: wms-core-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 虚拟线程（Java 21）
spring.threads.virtual.enabled: true

# Redisson
redisson:
  config: classpath:redisson.yaml

logging:
  level:
    com.xwms: debug
    org.springframework.kafka: info

# SpringDoc OpenAPI配置
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: "入库管理"
      paths-to-match: /inbound/**
      packages-to-scan: com.xwms.core.inbound
    - group: "出库管理"
      paths-to-match: /outbound/**
      packages-to-scan: com.xwms.core.outbound
    - group: "库存管理"
      paths-to-match: /inventory/**
      packages-to-scan: com.xwms.core.inventory
    - group: "批次管理"
      paths-to-match: /batch/**
      packages-to-scan: com.xwms.core.batch
    - group: "作业管理"
      paths-to-match: /operation/**, /work-task/**
      packages-to-scan: com.xwms.core.operation
    - group: "全部接口"
      paths-to-match: /**
      packages-to-scan: com.xwms.core

# PowerJob 分布式任务调度 Worker
powerjob:
  worker:
    enabled: true
    app-name: wms-core
    server-address: ${POWERJOB_SERVER:127.0.0.1:7700}
    protocol: AKKA
    port: 27777
    result-store-max-length: 4096
    max-result-length: 4096

# 敏感信息加密配置
wms:
  crypto:
    enabled: true
    secret-key: x-wms-platform-aes-256-key-2026!!

# LiteFlow 业务流程编排引擎
liteflow:
  rule-source: liteflow/*.xml
  enable: true
  print-execution-log: true
  parse-mode: one
  retry-count: 0
