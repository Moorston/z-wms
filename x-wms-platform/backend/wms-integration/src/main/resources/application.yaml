server:
  port: 8084
  servlet:
    context-path: /api
spring:
  application:
    name: wms-integration
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: wms
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: ${SENTINEL_PORT:8719}
      eager: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:wms_integration}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:root}
    druid:
      initial-size: 3
      max-active: 20
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 3
  kafka:
    bootstrap-servers: ${KAFKA_ADDR:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: wms-integration-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
spring.threads.virtual.enabled: true

# PowerJob 分布式任务调度 Worker
powerjob:
  worker:
    enabled: true
    app-name: wms-integration
    server-address: ${POWERJOB_SERVER:127.0.0.1:7700}
    protocol: AKKA
    port: 27780
    result-store-max-length: 4096
    max-result-length: 4096

# 敏感信息加密配置
wms:
  crypto:
    enabled: true
    secret-key: x-wms-platform-aes-256-key-2026!!

# ============================================================
# Elasticsearch 配置
# ============================================================
# ============================================================
# Elasticsearch 全文检索配置
# 依赖：co.elastic.clients:elasticsearch-java:8.11.0
# 索引：wms-api-call-log / wms-integration-message / wms-callback-record
# 分析器：ik_smart（中文分词，需 ES 预装 ik 插件）
# ============================================================
elasticsearch:
  host: ${ES_HOST:127.0.0.1}
  port: ${ES_PORT:9200}
  scheme: ${ES_SCHEME:http}
  username: ${ES_USERNAME:}
  password: ${ES_PASSWORD:}
  connectTimeout: 5000
  socketTimeout: 30000
  # 索引自动初始化（仅生产环境开启，避免开发环境误建）
  init:
    enabled: ${ES_INIT_ENABLED:false}
